<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WA読書部 — ワタシ文庫</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #f0e8d8;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', Georgia, serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    /* ── 入室ベール ── */
    #veil {
      position: fixed;
      inset: 0;
      background: #0d0a06;
      pointer-events: none;
      z-index: 90;
      opacity: 1;
      transition: opacity 4s ease;
    }
    /* CSS保険：JSが完全に落ちても5秒後にveilが消える */
    @keyframes veil-auto-fade {
      0%   { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }
    #veil { animation: veil-auto-fade 1.5s ease 4s forwards; }

    /* エラー表示 */
    #error-msg {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #5a4030;
      font-size: 14px;
      letter-spacing: 1px;
      text-align: center;
      line-height: 2;
      z-index: 999;
      background: rgba(245, 240, 230, 0.95);
      padding: 24px 32px;
      border-radius: 4px;
    }

    /* ── ヒント ── */
    #hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 248, 220, 0.0);
      font-size: 12px;
      letter-spacing: 4px;
      pointer-events: none;
      transition: opacity 1.5s ease;
      z-index: 50;
      white-space: nowrap;
    }
    #hint.show { color: rgba(255, 248, 220, 0.45); }

    /* ── フォーカスラベル ── */
    #focus-label {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 248, 220, 0);
      font-size: 13px;
      letter-spacing: 5px;
      pointer-events: none;
      transition: color 0.6s ease;
      z-index: 50;
    }
    #focus-label.show { color: rgba(255, 248, 220, 0.55); }

    /* ── 戻るボタン ── */
    #back-btn {
      position: fixed;
      bottom: 32px;
      right: 36px;
      color: rgba(255, 248, 220, 0);
      font-size: 11px;
      letter-spacing: 3px;
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      transition: color 0.5s ease;
      z-index: 50;
    }
    #back-btn.show { color: rgba(255, 248, 220, 0.4); }
    #back-btn:hover { color: rgba(255, 248, 220, 0.7) !important; }

    /* ── しおりオーバーレイ ── */
    #bookmark-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateY(20px) scale(0.94);
      width: 340px;
      background: #f7f2e4;
      border-radius: 3px 3px 2px 2px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 4px 16px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: all 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
      z-index: 200;
      overflow: visible;
    }
    #bookmark-overlay.open {
      opacity: 1;
      pointer-events: all;
      transform: translate(-50%, -50%) translateY(0) scale(1);
    }

    /* 上部タブ */
    .bm-header {
      background: #1a2a6c;
      color: white;
      padding: 10px 18px 8px;
      border-radius: 3px 3px 0 0;
      position: relative;
    }
    .bm-header-title {
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.9);
    }
    .bm-tab {
      position: absolute;
      top: -18px;
      right: 24px;
      background: #1a2a6c;
      padding: 4px 14px 6px;
      border-radius: 4px 4px 0 0;
      font-size: 10px;
      color: rgba(255,255,255,0.8);
      letter-spacing: 2px;
      line-height: 1.4;
      text-align: center;
    }

    /* ボディ */
    .bm-body { padding: 16px 18px 20px; }

    .bm-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .bm-label {
      font-size: 11px;
      color: #1a2a6c;
      letter-spacing: 1px;
    }

    /* テーブル */
    .bm-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 4px;
    }
    .bm-table th {
      border: 1px solid #1a2a6c;
      padding: 5px 6px;
      font-size: 11px;
      font-weight: normal;
      color: #1a2a6c;
      text-align: center;
      letter-spacing: 2px;
    }
    .bm-table td {
      border: 1px solid #1a2a6c;
      padding: 5px 6px;
    }
    .bm-table input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
      color: #1a2a6c;
      outline: none;
    }
    .bm-table input::placeholder { color: rgba(26, 42, 108, 0.3); }

    .bm-submit-wrap {
      text-align: center;
      margin-top: 16px;
    }
    .bm-submit {
      background: #1a2a6c;
      color: white;
      border: none;
      padding: 8px 28px;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 3px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s;
    }
    .bm-submit:hover { background: #243a8c; }

    .bm-close {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }
    .bm-close:hover { color: white; }

    /* ── 棚への反映アニメ ── */
    #shelf-flash {
      position: fixed;
      inset: 0;
      background: rgba(255, 248, 220, 0);
      pointer-events: none;
      z-index: 300;
      transition: background 0.3s;
    }
    #shelf-flash.flash { background: rgba(255, 248, 220, 0.15); }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="veil"></div>
  <div id="error-msg"></div>
  <div id="hint">気になるものへ 近づいてください</div>
  <div id="focus-label"></div>
  <button id="back-btn" onclick="window._goHome && window._goHome()">— 俯瞰する</button>
  <div id="shelf-flash"></div>

  <!-- しおりオーバーレイ -->
  <div id="bookmark-overlay">
    <div class="bm-header">
      <div class="bm-tab">WA読書部<br>ワタシ文庫</div>
      <div class="bm-header-title">読書記録しおり</div>
      <button class="bm-close" id="bm-close-btn">×</button>
    </div>
    <div class="bm-body">
      <div class="bm-row">
        <span class="bm-label">読書記録しおり</span>
        <span class="bm-label">文庫 No.<span id="bm-no">001</span></span>
      </div>
      <table class="bm-table">
        <thead>
          <tr>
            <th style="width:70px">日　付</th>
            <th>書　　名</th>
            <th style="width:80px">著 者 名</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="text" id="bm-date" placeholder="4/22"></td>
            <td><input type="text" id="bm-title" placeholder="書名を入力"></td>
            <td><input type="text" id="bm-author" placeholder="著者名"></td>
          </tr>
          <tr><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td></tr>
        </tbody>
      </table>
      <div class="bm-submit-wrap">
        <button class="bm-submit" id="bm-submit">棚に並べる</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
